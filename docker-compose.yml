services:
  rota-chat:
    container_name: rota-chat
    build:
      context: .
      dockerfile: Dockerfile
    image: rota-chat-generator:1.0.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      API_JSON_LIMIT: 5mb
      UPLOAD_LIMIT_BYTES: 10485760
    ports:
      - "${APP_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

