services:
  rota-chat:
    container_name: rota-chat
    build:
      context: .
      dockerfile: Dockerfile
    image: rota-chat-generator:1.0.0
    restart: unless-stopped
    environment:
      TZ: "Europe/Paris"
      NODE_ENV: "production"
      HOST: "0.0.0.0"
      PORT: "8000"
      API_JSON_LIMIT: "5mb"
      UPLOAD_LIMIT_BYTES: "10485760"
      PUBLISHED_ROTATION_PATH: "/data/published-rotation.json"
    ports:
      - "8088:8000"
    volumes:
      - rota_chat_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  rota_chat_data:
